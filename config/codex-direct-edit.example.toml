# Example only: fixed 0.16.0 build, trusted project-scoped .codex/config.toml.
# Back up private settings. Disable each older InoProShop entry before handoff;
# keep its build and unrelated services unchanged. Registry v2 needs this reader.
# Select an account-supported model in the local private configuration.
approval_policy = "on-request"
sandbox_mode = "read-only"

[mcp_servers.inoproshop]
command = 'C:\Program Files\nodejs\node.exe'
args = ['D:\InoPro-Codex-0.16\dist\server.js']
cwd = 'D:\InoPro-Codex-0.16'
startup_timeout_sec = 30
tool_timeout_sec = 180
enabled = true

[mcp_servers.inoproshop.env]
INOPRO_DATA_DIR = 'D:\Existing-InoPro-Data'
INOPRO_EXE = 'D:\InProShop\CODESYS\Common\InoProShop.exe'
INOPRO_PROFILE = 'InoProShop(V1.9.1.6)'
INOPRO_NO_UI = 'false'
INOPRO_TIMEOUT_MS = '120000'
INOPRO_RESPONSE_WAIT_MS = '15000'
INOPRO_TEST_MODE = ''

# One client at a time. Confirm DSH idle, release it normally, and verify exit.
# Existing CLI sessions don't reload this file automatically; verify a new one.
# No DSH maxInstructionBytes, execution-policy override or permission bypass.
# Evidence-only protocol observers are not a normal deployment requirement.
