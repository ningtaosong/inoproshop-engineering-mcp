# Example paths only. Use a verified, trusted fixed 0.15.0 checkout's
# .codex/config.toml; preserve the separate 0.14.0 configuration.
# First hand over the existing engineering registry from its sole client.
# Choose an account-supported model locally, rather than globally.
approval_policy = "on-request"
sandbox_mode = "read-only"

[mcp_servers.inoproshop]
command = 'C:\Program Files\nodejs\node.exe'
args = ['D:\InoPro-Codex-0.15\dist\server.js']
cwd = 'D:\InoPro-Codex-0.15'
startup_timeout_sec = 30
tool_timeout_sec = 180
enabled = true

[mcp_servers.inoproshop.env]
INOPRO_DATA_DIR = 'D:\Existing-InoPro-Data'
INOPRO_EXE = 'D:\InProShop\CODESYS\Common\InoProShop.exe'
INOPRO_PROFILE = 'InoProShop(V1.9.1.6)'
INOPRO_NO_UI = 'false'
INOPRO_TIMEOUT_MS = '120000'
INOPRO_RESPONSE_WAIT_MS = '15000'
INOPRO_TEST_MODE = ''

# DSH maxInstructionBytes is not a Codex option.
# Evidence-only NODE_OPTIONS and child execution settings are not product
# requirements. This template does not alter machine/user execution policies.
